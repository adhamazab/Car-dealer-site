<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Dealer - Available Cars</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    header {
      background-color: #1a1a1a;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .car {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin: 15px;
      width: 300px;
      overflow: hidden;
    }
    .car img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .car-details {
      padding: 15px;
    }
    .car-details h3 {
      margin: 0;
    }
    .contact {
      display: block;
      margin-top: 10px;
      background-color: #28a745;
      color: white;
      text-align: center;
      padding: 10px;
      text-decoration: none;
      border-radius: 4px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: #1a1a1a;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Available Cars for Sale</h1>
  </header>
  <div class="container">
    <div class="car">
      <img src="https://via.placeholder.com/300x200?text=Toyota+Camry" alt="Toyota Camry">
      <div class="car-details">
        <h3>Toyota Camry 2020</h3>
        <p>Price: $18,500</p>
        <a class="contact" href="https://wa.me/11234567890" target="_blank">Contact via WhatsApp</a>
      </div>
    </div>
    <div class="car">
      <img src="https://via.placeholder.com/300x200?text=Honda+Civic" alt="Honda Civic">
      <div class="car-details">
        <h3>Honda Civic 2019</h3>
        <p>Price: $16,200</p>
        <a class="contact" href="https://wa.me/11234567890" target="_blank">Contact via WhatsApp</a>
      </div>
    </div>
    <div class="car">
      <img src="https://via.placeholder.com/300x200?text=Ford+Focus" alt="Ford Focus">
      <div class="car-details">
        <h3>Ford Focus 2018</h3>
        <p>Price: $13,700</p>
        <a class="contact" href="https://wa.me/11234567890" target="_blank">Contact via WhatsApp</a>
      </div>
    </div>
  </div>
  <footer>
    <p>&copy; 2025 Car Dealer. All rights reserved.</p>
  </footer>
</body>
</html>
