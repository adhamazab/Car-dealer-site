<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azab Group - Car Dealer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
        }
        .hero {
            background-image: url('https://source.unsplash.com/1600x600/?car');
            background-size: cover;
            background-position: center;
            height: 300px;
        }
        .content {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }
        .car-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .car-gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }
        .contact {
            background-color: #222;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .contact p {
            margin: 10px 0;
        }
        footer {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body><header>
    <h1>Azab Group</h1>
    <p>Your Trusted Car Dealer</p>
</header>

<div class="hero"></div>

<div class="content">
    <h2>Available Cars</h2>
    <div class="car-gallery">
        <img src="https://source.unsplash.com/featured/?car,luxury" alt="Luxury Car">
        <img src="https://source.unsplash.com/featured/?car,sport" alt="Sport Car">
        <img src="https://source.unsplash.com/featured/?car,suv" alt="SUV Car">
        <img src="https://source.unsplash.com/featured/?car,sedan" alt="Sedan Car">
    </div>
</div>

<div class="contact">
    <h2>Contact Us</h2>
    <p>Phone: 01104135414</p>
    <p>Email: info@azabgroup.com</p>
    <p>Location: Cairo, Egypt</p>
</div>

<footer>
    &copy; 2025 Azab Group. All rights reserved.
</footer>

</body>
</html>
